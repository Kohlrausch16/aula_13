{% if messages %}
<div class="messages" aria-live="polite">
    {% for mensagem in messages %}
    <div class="message {% if 'success' in mensagem.tags %}message-success{% elif 'error' in mensagem.tags %}message-error{% else %}message-info{% endif %}" role="status">{{ mensagem }}</div>
    {% endfor %}
</div>
{% endif %}
