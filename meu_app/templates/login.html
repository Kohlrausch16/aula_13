{% extends 'base.html' %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="page-heading">
    <span class="eyebrow">Sua conta</span>
    <h1>Entrar</h1>
    <p>Acesse sua conta para gerenciar seus produtos.</p>
</div>
<section class="card form-card auth-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="button button-primary" type="submit">Entrar</button>
            <a class="button button-secondary" href="{% url 'cadastrar_usuario' %}">Criar conta</a>
        </div>
    </form>
</section>
{% endblock %}
