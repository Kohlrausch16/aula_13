{% extends 'base.html' %}
{% block title %}Cadastrar produto{% endblock %}
{% block content %}
<div class="page-heading">
    <span class="eyebrow">Catálogo</span>
    <h1>Cadastrar produto</h1>
    <p>Adicione um novo item ao seu catálogo.</p>
</div>
<section class="card form-card">
    <form method="post">
        {% csrf_token %}
        {{ formulario.as_p }}
        <div class="form-actions">
            <button class="button button-primary" type="submit">Cadastrar produto</button>
            <a class="button button-secondary" href="{% url 'listar_produtos' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
