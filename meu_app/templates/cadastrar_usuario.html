{% extends 'base.html' %}
{% block title %}Criar conta{% endblock %}
{% block content %}
<div class="page-heading">
    <span class="eyebrow">Sua conta</span>
    <h1>Criar conta</h1>
    <p>Preencha os dados abaixo para começar.</p>
</div>
<section class="card form-card auth-card">
    <form method="post">
        {% csrf_token %}
        {{ formulario.as_p }}
        <div class="form-actions">
            <button class="button button-primary" type="submit">Cadastrar</button>
            <a class="button button-secondary" href="{% url 'login' %}">Já tenho conta</a>
        </div>
    </form>
</section>
{% endblock %}
